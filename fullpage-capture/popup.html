<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="sheet">
      <div id="alert" class="alert" hidden>
        <svg class="alert__icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <circle cx="8" cy="8" r="6.25" stroke="currentColor" stroke-width="1.3" />
          <path d="M8 4.75v3.75" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
          <circle cx="8" cy="11.15" r="0.75" fill="currentColor" />
        </svg>
        <span class="alert__text">
          <span id="alert-title" class="alert__title"></span>
          <span id="alert-detail" class="alert__detail"></span>
        </span>
      </div>

      <div id="idle" class="menu" hidden>
        <button id="save" class="row" type="button">
          <svg class="row__icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M8 2.75v7m0 0 2.5-2.5M8 9.75 5.5 7.25" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M3 11v1.25c0 .69.56 1.25 1.25 1.25h7.5c.69 0 1.25-.56 1.25-1.25V11" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
          </svg>
          <span id="save-label" class="row__label">Save as PNG</span>
          <svg id="save-default" class="row__check" viewBox="0 0 16 16" fill="none" aria-hidden="true" hidden>
            <path d="m3.5 8.5 3 3 6-7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>

        <button id="copy" class="row" type="button">
          <svg class="row__icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <rect x="6" y="6" width="7.25" height="7.25" rx="1.75" stroke="currentColor" stroke-width="1.3" />
            <path d="M10 4.4a1.75 1.75 0 0 0-1.75-1.65h-3.5A1.75 1.75 0 0 0 3 4.5v3.5c0 .92.7 1.68 1.6 1.74" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
          </svg>
          <span class="row__label">Copy to clipboard</span>
          <svg id="copy-default" class="row__check" viewBox="0 0 16 16" fill="none" aria-hidden="true" hidden>
            <path d="m3.5 8.5 3 3 6-7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>

        <button id="preview" class="row" type="button">
          <svg class="row__icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <rect x="2.75" y="3.25" width="10.5" height="9.5" rx="1.75" stroke="currentColor" stroke-width="1.3" />
            <path d="M2.75 10 6 7.25l2.25 2 1.75-1.5 3.25 2.75" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span class="row__label">Open in preview</span>
          <svg id="preview-default" class="row__check" viewBox="0 0 16 16" fill="none" aria-hidden="true" hidden>
            <path d="m3.5 8.5 3 3 6-7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>

        <div class="divider" role="separator"></div>

        <button id="format" class="row row--setting" type="button">
          <svg class="row__icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <rect x="2.75" y="2.75" width="10.5" height="10.5" rx="1.75" stroke="currentColor" stroke-width="1.3" />
            <path d="m3.5 11 3-3 2.5 2.25L11 8.5l1.75 1.75" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span class="row__text">
            <span class="row__label">File format</span>
            <span id="format-status" class="row__status"></span>
          </span>
          <span id="format-value" class="row__hint"></span>
        </button>

        <button id="overlays" class="row row--setting" type="button" role="switch" aria-checked="false">
          <svg class="row__icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M2 3.75h12M2 8h12M2 12.25h7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
            <path d="m11 11 3.25 3.25M14.25 11 11 14.25" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
          </svg>
          <span class="row__text">
            <span class="row__label">Hide overlays</span>
            <span id="overlays-status" class="row__status"></span>
          </span>
        </button>
      </div>

      <div id="running" class="menu" hidden>
        <div class="status">
          <span id="progress-label" class="status__label">Preparing</span>
          <span id="progress-count" class="status__count"></span>
        </div>
        <div class="track">
          <div id="progress-bar" class="track__fill is-indeterminate"></div>
        </div>

        <button id="cancel" class="row" type="button">
          <svg class="row__icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="m5.5 5.5 5 5m0-5-5 5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
          </svg>
          <span class="row__label">Cancel</span>
          <span class="row__hint">esc</span>
        </button>
      </div>

      <button id="shortcut" class="foot" type="button">
        <span id="foot-text"></span>
        <span id="foot-action" class="foot__action"></span>
      </button>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
