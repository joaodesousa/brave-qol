<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Capture preview</title>
    <link rel="stylesheet" href="preview.css" />
  </head>
  <body>
    <header class="bar">
      <div class="bar__meta">
        <span id="title" class="bar__title">Capture</span>
        <span id="meta" class="bar__sub"></span>
      </div>

      <div class="bar__actions">
        <button id="crop" class="btn" type="button">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M4.5 1.5v10h10M1.5 4.5h10v10" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span id="crop-label">Crop</span>
        </button>

        <button id="zoom" class="btn" type="button">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <circle cx="7.25" cy="7.25" r="4.5" stroke="currentColor" stroke-width="1.3" />
            <path d="m10.75 10.75 3 3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
          </svg>
          <span id="zoom-label">Actual</span>
        </button>

        <div class="sep" role="separator"></div>

        <button id="copy" class="btn" type="button">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <rect x="6" y="6" width="7.25" height="7.25" rx="1.75" stroke="currentColor" stroke-width="1.3" />
            <path d="M10 4.4a1.75 1.75 0 0 0-1.75-1.65h-3.5A1.75 1.75 0 0 0 3 4.5v3.5c0 .92.7 1.68 1.6 1.74" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
          </svg>
          <span>Copy</span>
        </button>

        <button id="png" class="btn btn--primary" type="button">Save PNG</button>
        <button id="webp" class="btn" type="button">WebP</button>
        <button id="jpg" class="btn" type="button">JPEG</button>
        <button id="pdf" class="btn" type="button">PDF</button>
      </div>
    </header>

    <main id="stage" class="stage">
      <div id="empty" class="empty" hidden>
        <p class="empty__title">This capture is no longer available</p>
        <p class="empty__detail">
          The preview is handed over once, and the extension may have restarted since. Take a new capture.
        </p>
      </div>

      <div id="frame" class="frame" hidden>
        <img id="image" alt="Captured page" />
        <div id="overlay" class="overlay" hidden>
          <div id="selection" class="selection" hidden></div>
        </div>
      </div>
    </main>

    <div id="toast" class="toast" hidden></div>

    <script src="pdf.js"></script>
    <script src="preview.js"></script>
  </body>
</html>
